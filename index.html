<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora de práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root{
    --nearblack: #18130D;
    --ink:       #231C14;
    --ivory:     #F1E9D8;
    --ivory-dim: #cfc6b4;
    --brass:     #A8772E;
    --wine:      #6E2335;
    --hairline:  rgba(255,255,255,0.10);
    --panel:     #211a12;
  }
 
  body{
    background: var(--nearblack);
    color: var(--ivory);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  .wrap{ max-width: 880px; margin: 0 auto; }

  header{ margin-bottom: 40px; }

  h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: clamp(30px, 5vw, 42px);
    line-height: 1.05;
    margin-bottom: 6px;
  }
  h1 em{ font-style: italic; color: var(--brass); }

  .subt{ color: var(--ivory-dim); font-size: 14px; }

  /* ---- hero semana ---- */
  .hero{
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin: 28px 0 10px;
    flex-wrap: wrap;
  }
  .hero .num{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: clamp(48px, 9vw, 72px);
    line-height: 1;
    color: var(--ivory);
  }
  .hero .num small{
    font-size: 0.4em;
    color: var(--ivory-dim);
    font-weight: 400;
  }
  .hero .marking{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--brass);
  }

  .bar-track{
    height: 6px;
    background: var(--hairline);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 44px;
  }
  .bar-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--wine), var(--brass), #4d8a52);
    transition: width 0.4s ease;
  }

  /* ---- panel shell ---- */
  .panel{
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 24px;
    background: var(--panel);
    margin-bottom: 24px;
  }

  .panel-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .panel-title{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 20px;
    color: var(--ivory);
  }
  .nav-btns{ display: flex; gap: 6px; align-items: center; }
  .nav-btns button{
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--ivory-dim);
    width: 30px; height: 30px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
    transition: border-color 0.15s, color 0.15s;
  }
  .nav-btns button:hover{ border-color: var(--brass); color: var(--brass); }
  .nav-btns .month-label{
    font-size: 13px;
    color: var(--ivory-dim);
    min-width: 120px;
    text-align: center;
    text-transform: capitalize;
  }

  /* ---- calendario ---- */
  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-dow{
    font-size: 11px;
    color: var(--ivory-dim);
    text-align: center;
    padding-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .cal-day{
    aspect-ratio: 1;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 11px;
    color: var(--ivory-dim);
    border: 1px solid var(--hairline);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
    position: relative;
  }
  .cal-day:hover{ transform: translateY(-1px); border-color: var(--brass); }
  .cal-day.empty{ border: none; cursor: default; }
  .cal-day.empty:hover{ transform: none; }
  .cal-day .n{ font-weight: 500; opacity: 0.85; }
  .cal-day .c{ font-size: 9px; opacity: 0.75; }
  .cal-day.today{ outline: 2px solid var(--brass); outline-offset: -2px; }
  .cal-day.selected{ outline: 2px solid var(--ivory); outline-offset: -2px; }

  /* ---- leyenda de dinámicas ---- */
  .legend{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--ivory-dim);
  }
  .legend .chip{
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend .dot{
    width: 11px; height: 11px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .legend .mark{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ivory);
  }

  /* ---- registro del día ---- */
  .row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .day-picker{
    font-size: 13px;
    color: var(--ivory-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .day-picker input[type="date"]{
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 5px;
    color: var(--ivory);
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    padding: 6px 8px;
    color-scheme: dark;
  }

  .day-total{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--ivory);
  }
  .day-total b{ color: var(--brass); font-style: normal; }

  .objetivos-list{
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .objetivo-item{
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .objetivo-item.done{
    border-color: var(--brass);
    background: rgba(168,119,46,0.08);
  }
  .objetivo-toggle{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
  }
  .objetivo-item .area{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--ivory);
  }
  .objetivo-item.done .area{ color: var(--brass); }
  .objetivo-item .check{
    width: 22px; height: 22px;
    border-radius: 5px;
    border: 1.5px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: transparent;
    font-size: 13px;
    transition: all 0.15s ease;
  }
  .objetivo-item.done .check{
    background: var(--brass);
    border-color: var(--brass);
    color: var(--nearblack);
  }
  .objetivo-desc{
    width: 100%;
    min-height: 56px;
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 5px;
    color: var(--ivory);
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    resize: vertical;
    line-height: 1.5;
  }
  .objetivo-desc::placeholder{ color: var(--ivory-dim); opacity: 0.6; }
  .objetivo-desc:focus{ outline: none; border-color: var(--brass); }

  @media (max-width: 520px){
    .cal-day .c{ display: none; }
    .legend{ gap: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Bitácora de <em>práctica</em></h1>
    <p class="subt">Meta: 1 objetivo cumplido por área al día · 20 objetivos a la semana</p>
  </header>

  <div class="hero">
    <div class="num" id="hero-num">0<small> / 20</small></div>
    <div class="marking" id="hero-marking">—</div>
  </div>
  <div class="bar-track"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>

  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Calendario</span>
      <div class="nav-btns">
        <button id="btn-prev">‹</button>
        <span class="month-label" id="month-label">—</span>
        <button id="btn-next">›</button>
      </div>
    </div>

    <div class="cal-grid" id="cal-grid"></div>

    <div class="legend" id="legend"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Objetivos del día</span>
      <div class="day-picker">
        <span>Día:</span>
        <input type="date" id="input-date">
      </div>
    </div>

    <div class="objetivos-list" id="objetivos-list"></div>

    <div class="row">
      <div class="day-total">Ese día llevas: <b id="day-count">0</b> / 4</div>
    </div>
  </div>

</div>

<script>
  const AREAS = [
    { key: 'arquitectura', label: 'Arquitectura' },
    { key: 'academia', label: 'Academia de piano · promoción y seguimiento' },
    { key: 'piano', label: 'Piano · estudio' },
    { key: 'finanzas', label: 'Finanzas' }
  ];
  const DAILY_MAX = AREAS.length;
  const WEEKLY_GOAL = 20;
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DOW = ['L','M','M','J','V','S','D'];

  const DYNAMICS = [
    { mark: 'pp', min: 0,    color: [122, 43, 58]  },
    { mark: 'p',  min: 0.17, color: [184, 82, 79]  },
    { mark: 'mp', min: 0.34, color: [201, 138, 75] },
    { mark: 'mf', min: 0.51, color: [184, 162, 63] },
    { mark: 'f',  min: 0.67, color: [122, 155, 82] },
    { mark: 'ff', min: 0.84, color: [63, 143, 79]  }
  ];

  function pad(n){ return String(n).padStart(2,'0'); }
  function todayISO(){
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  function isoToDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  function colorForCount(count){
    if (count <= 0) return null;
    const pct = Math.min(count / DAILY_MAX, 1);
    let lower = DYNAMICS[0], upper = DYNAMICS[DYNAMICS.length-1];
    for (let i = 0; i < DYNAMICS.length - 1; i++){
      if (pct >= DYNAMICS[i].min && pct <= DYNAMICS[i+1].min){
        lower = DYNAMICS[i]; upper = DYNAMICS[i+1]; break;
      }
      if (pct >= DYNAMICS[DYNAMICS.length-1].min){ lower = upper = DYNAMICS[DYNAMICS.length-1]; }
    }
    const span = upper.min - lower.min || 1;
    const t = Math.min(Math.max((pct - lower.min) / span, 0), 1);
    const rgb = lower.color.map((c,i) => Math.round(c + (upper.color[i]-c)*t));
    return `rgb(${rgb.join(',')})`;
  }

  function markForCount(count){
    if (count <= 0) return '—';
    const pct = Math.min(count / DAILY_MAX, 1);
    let mark = DYNAMICS[0].mark;
    for (const d of DYNAMICS){ if (pct >= d.min) mark = d.mark; }
    return mark;
  }

  let viewDate = new Date();
  let selectedISO = todayISO();
  const countsCache = {};

  function getDay(iso){
    try{
      const raw = localStorage.getItem(`objetivos:${iso}`);
      return raw ? JSON.parse(raw) : {};
    } catch(e){ return {}; }
  }

  function saveDay(iso, obj){
    localStorage.setItem(`objetivos:${iso}`, JSON.stringify(obj));
    countsCache[iso] = AREAS.filter(a => obj[a.key] && obj[a.key].done).length;
  }

  function getCount(iso){
    if (countsCache[iso] !== undefined) return countsCache[iso];
    const obj = getDay(iso);
    const count = AREAS.filter(a => obj[a.key] && obj[a.key].done).length;
    countsCache[iso] = count;
    return count;
  }

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  function renderLegend(){
    const el = document.getElementById('legend');
    el.innerHTML = DYNAMICS.map(d => {
      const rgb = `rgb(${d.color.join(',')})`;
      return `<span class="chip"><span class="dot" style="background:${rgb}"></span><span class="mark">${d.mark}</span></span>`;
    }).join('');
  }

  async function renderCalendar(){
    const grid = document.getElementById('cal-grid');
    const label = document.getElementById('month-label');
    label.textContent = `${MESES[viewDate.getMonth()]} ${viewDate.getFullYear()}`;

    grid.innerHTML = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');

    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const startOffset = (firstDay.getDay() + 6) % 7; // lunes = 0
    const daysInMonth = new Date(year, month+1, 0).getDate();

    for (let i = 0; i < startOffset; i++){
      grid.insertAdjacentHTML('beforeend', `<div class="cal-day empty"></div>`);
    }

    const todayStr = todayISO();

    for (let day = 1; day <= daysInMonth; day++){
      const d = new Date(year, month, day);
      const iso = `${year}-${pad(month+1)}-${pad(day)}`;
      const count = await getCount(iso);
      const color = colorForCount(count);
      const cell = document.createElement('div');
      cell.className = 'cal-day';
      if (iso === todayStr) cell.classList.add('today');
      if (iso === selectedISO) cell.classList.add('selected');
      cell.style.background = color || 'rgba(255,255,255,0.03)';
      cell.innerHTML = `<span class="n">${day}</span>${count > 0 ? `<span class="c">${count}</span>` : ''}`;
      cell.addEventListener('click', () => {
        selectedISO = iso;
        document.getElementById('input-date').value = iso;
        renderCalendar();
        renderObjetivos();
      });
      grid.appendChild(cell);
    }
  }

  async function renderWeekHero(){
    const base = isoToDate(selectedISO);
    const dow = (base.getDay() + 6) % 7; // lunes=0
    const monday = new Date(base);
    monday.setDate(base.getDate() - dow);

    let total = 0;
    for (let i = 0; i < 7; i++){
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const iso = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      total += await getCount(iso);
    }

    document.getElementById('hero-num').innerHTML = `${total}<small> / ${WEEKLY_GOAL}</small>`;
    document.getElementById('hero-marking').textContent = markForCount(Math.round((total/WEEKLY_GOAL)*DAILY_MAX));
    const pct = Math.min((total / WEEKLY_GOAL) * 100, 100);
    document.getElementById('bar-fill').style.width = `${pct}%`;
  }

  function renderObjetivos(){
    const dayObj = getDay(selectedISO);

    const list = document.getElementById('objetivos-list');
    list.innerHTML = AREAS.map(a => {
      const entry = dayObj[a.key] || {};
      const done = !!entry.done;
      const desc = entry.desc || '';
      return `<div class="objetivo-item${done ? ' done' : ''}" data-key="${a.key}">
        <div class="objetivo-toggle" data-role="toggle">
          <span class="area">${a.label}</span>
          <span class="check">${done ? '✓' : ''}</span>
        </div>
        <textarea class="objetivo-desc" data-role="desc" rows="2" placeholder="¿Qué hiciste? (opcional)">${escapeHtml(desc)}</textarea>
      </div>`;
    }).join('');

    list.querySelectorAll('.objetivo-item').forEach(el => {
      const key = el.dataset.key;

      el.querySelector('[data-role="toggle"]').addEventListener('click', () => {
        const obj = getDay(selectedISO);
        const entry = obj[key] || {};
        entry.done = !entry.done;
        obj[key] = entry;
        saveDay(selectedISO, obj);
        renderObjetivos();
        renderCalendar();
        renderWeekHero();
      });

      el.querySelector('[data-role="desc"]').addEventListener('change', (e) => {
        const obj = getDay(selectedISO);
        const entry = obj[key] || {};
        entry.desc = e.target.value;
        obj[key] = entry;
        saveDay(selectedISO, obj);
      });
    });

    document.getElementById('day-count').textContent =
      AREAS.filter(a => dayObj[a.key] && dayObj[a.key].done).length;
  }

  document.getElementById('btn-prev').addEventListener('click', () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
    renderCalendar();
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
    renderCalendar();
  });
  document.getElementById('input-date').addEventListener('change', (e) => {
    selectedISO = e.target.value;
    const d = isoToDate(selectedISO);
    viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
    renderCalendar();
    renderObjetivos();
    renderWeekHero();
  });

  (async function init(){
    document.getElementById('input-date').value = selectedISO;
    renderLegend();
    await renderCalendar();
    renderObjetivos();
    await renderWeekHero();
  })();
</script>
</body>
</html>
